<section class="card">
  <header class="card-header">
    <h1 class="titulo">Alunos Excluídos</h1>
    <a class="btn btn-secundario" routerLink="/">Voltar</a>
  </header>

<div class="filtros">
    <div class="campo-busca">
      <svg class="icone-busca" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="11" cy="11" r="7" />
        <line x1="16.5" y1="16.5" x2="21" y2="21" />
      </svg>
      <input
        type="text"
        placeholder="Buscar por nome ou matrícula..."
        aria-label="Buscar aluno"
        [value]="busca()"
        (input)="aoDigitarBusca($event)"
      />
    </div>
</div>

  <div class="tabela-wrapper">
    <table class="tabela">
      <thead>
        <tr>
          <th>Matrícula</th>
          <th>Nome</th>
          <th>Status</th>
          <th>Data de Exclusão</th>
          <th>Ações</th>
        </tr>
      </thead>

      <tbody>
        @if (carregando()) {
          <tr>
            <td colspan="5" class="linha-info">Carregando...</td>
          </tr>
        } @else {

          @for (aluno of alunos(); track aluno.id) {
            <tr>
              <td>{{ aluno.matricula }}</td>
              <td>{{ aluno.nomeCompleto }}</td>
              <td>{{ statusLabel(aluno.status) }}</td>
              <td>{{ aluno.dataExclusao | date:'dd/MM/yyyy HH:mm' }}</td>
              
              <td>
                <div class="acoes">
                  <button class="btn btn-primario" (click)="restaurarAluno(aluno.id)">Restaurar</button>
                </div>
              </td>
            </tr>
          }
        }
      </tbody>
    </table>
  </div>
</section>
