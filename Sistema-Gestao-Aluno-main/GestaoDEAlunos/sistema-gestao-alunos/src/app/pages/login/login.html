
<main class="login-fundo">
  <section class="login-card" aria-labelledby="login-titulo">
    <h1 id="login-titulo">Start Students</h1>
    <p class="subtitulo">Faça seu login para continuar</p>


    @if (erro()) {
      <p class="alerta-erro" role="alert">{{ erro() }}</p>
    } @else if (sessaoExpirada) {
      <p class="alerta-erro" role="alert">Sua sessão expirou. Faça login novamente.</p>
    }

    <form [formGroup]="form" (ngSubmit)="entrar()" novalidate>

      <div class="campo-login">
        <label for="usuario">Usuário</label>
        <div class="input-com-icone" [class.invalido]="campoInvalido('usuario')">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8" /></svg>
          <input id="usuario" type="text" formControlName="usuario" placeholder="usuario123"
            autocomplete="username" [attr.aria-invalid]="campoInvalido('usuario')" />
        </div>
        @if (campoInvalido('usuario')) { <small class="msg-erro">{{ mensagemErro('usuario') }}</small> }
      </div>

      <div class="campo-login">
        <label for="senha">Senha</label>
        <div class="input-com-icone" [class.invalido]="campoInvalido('senha')">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3" /></svg>
          <input id="senha" [type]="mostrarSenha() ? 'text' : 'password'" formControlName="senha"
            maxlength="20" autocomplete="current-password" [attr.aria-invalid]="campoInvalido('senha')" />

          <button type="button" class="btn-olho" (click)="alternarSenha()"
            [attr.aria-label]="mostrarSenha() ? 'Ocultar senha' : 'Mostrar senha'"
            [attr.aria-pressed]="mostrarSenha()">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
              <circle cx="12" cy="12" r="3" />
              @if (mostrarSenha()) { <path d="M3 21 21 3" /> }
            </svg>
          </button>
        </div>
        @if (campoInvalido('senha')) { <small class="msg-erro">{{ mensagemErro('senha') }}</small> }
      </div>


      <button type="submit" class="btn btn-primario btn-acessar" [disabled]="form.invalid || entrando()">
        @if (entrando()) { <span class="spinner-login" aria-hidden="true"></span> Entrando... }
        @else { Acessar }
      </button>
    </form>
  </section>
</main>
